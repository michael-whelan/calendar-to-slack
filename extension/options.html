<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calendar to Slack — options</title>
    <style>
      body { font: 14px/1.5 Roboto, Arial, sans-serif; margin: 24px; max-width: 32rem; }
      label { display: block; margin: 16px 0 4px; font-weight: 500; }
      input { width: 100%; padding: 8px; box-sizing: border-box; }
      p { color: #5f6368; }
      button { margin-top: 16px; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <h1>Calendar to Slack</h1>
    <p>Both values come from the Apps Script project — see the repository README.</p>

    <label for="endpoint">Web app URL</label>
    <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" />

    <label for="secret">Shared secret</label>
    <input id="secret" type="password" />

    <button id="save">Save</button>
    <p id="status" role="status"></p>

    <script src="options.js"></script>
  </body>
</html>
